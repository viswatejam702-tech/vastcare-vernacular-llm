services:
  - type: web
    name: vastcare-vernacular-llm
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn serving.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
